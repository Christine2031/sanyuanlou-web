<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 200 200" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <!-- White background disc -->
  <circle cx="100" cy="100" r="99" fill="white"/>

  <!-- Double outer ring -->
  <circle cx="100" cy="100" r="96" stroke="#B8962A" stroke-width="1.8" fill="none"/>
  <circle cx="100" cy="100" r="91" stroke="#B8962A" stroke-width="0.6" fill="none"/>

  <!-- Outer frame rectangle (circle clips the corners naturally) -->
  <rect x="28" y="18" width="144" height="147" stroke="#B8962A" stroke-width="1" fill="none"/>

  <!-- Center column vertical dividers (extend to 1846 box bottom) -->
  <line x1="74"  y1="18" x2="74"  y2="182" stroke="#B8962A" stroke-width="0.85"/>
  <line x1="126" y1="18" x2="126" y2="182" stroke="#B8962A" stroke-width="0.85"/>

  <!-- 1846 box bottom line -->
  <line x1="74" y1="182" x2="126" y2="182" stroke="#B8962A" stroke-width="1"/>

  <!-- Horizontal row dividers (full width, 3 equal rows of 49px) -->
  <line x1="28" y1="67"  x2="172" y2="67"  stroke="#B8962A" stroke-width="0.85"/>
  <line x1="28" y1="116" x2="172" y2="116" stroke="#B8962A" stroke-width="0.85"/>

  <!-- Left window lattice panels (inset rectangles) -->
  <rect x="33" y="23"  width="36" height="39" stroke="#B8962A" stroke-width="0.6" fill="none"/>
  <rect x="33" y="72"  width="36" height="39" stroke="#B8962A" stroke-width="0.6" fill="none"/>
  <rect x="33" y="121" width="36" height="39" stroke="#B8962A" stroke-width="0.6" fill="none"/>

  <!-- Right window lattice panels -->
  <rect x="131" y="23"  width="36" height="39" stroke="#B8962A" stroke-width="0.6" fill="none"/>
  <rect x="131" y="72"  width="36" height="39" stroke="#B8962A" stroke-width="0.6" fill="none"/>
  <rect x="131" y="121" width="36" height="39" stroke="#B8962A" stroke-width="0.6" fill="none"/>

  <!-- Characters: 三 元 楼 vertical stack -->
  <!-- Font: STXingkai preferred (Chinese calligraphy / running script) -->
  <text x="100" y="57"
        text-anchor="middle"
        font-family="STXingkai, 华文行楷, STKaiti, 华文楷体, KaiTi, 楷体, serif"
        font-size="42" fill="#B8962A">三</text>

  <text x="100" y="106"
        text-anchor="middle"
        font-family="STXingkai, 华文行楷, STKaiti, 华文楷体, KaiTi, 楷体, serif"
        font-size="42" fill="#B8962A">元</text>

  <text x="100" y="155"
        text-anchor="middle"
        font-family="STXingkai, 华文行楷, STKaiti, 华文楷体, KaiTi, 楷体, serif"
        font-size="42" fill="#B8962A">楼</text>

  <!-- 1846 -->
  <text x="100" y="177"
        text-anchor="middle"
        font-family="Garamond, 'Times New Roman', serif"
        font-size="11" fill="#B8962A" letter-spacing="2">1846</text>

</svg>
